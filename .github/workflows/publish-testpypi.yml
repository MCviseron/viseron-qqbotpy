name: Publish to TestPyPI

# 手动触发。想先验证打包与上传链路时用这个，不影响正式 PyPI。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要发布的分支 / tag / commit（留空则用当前 ref）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-testpypi
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Run tests
        run: python -m pytest -q -rs

      - name: Check release consistency
        run: python scripts/check_release.py

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Show artifacts
        run: ls -l dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-testpypi
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to TestPyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/viseron-qqbotpy
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-testpypi
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI 允许重复上传同名同版本时跳过，方便反复验证；正式 PyPI 不用这个开关。
          skip-existing: true
