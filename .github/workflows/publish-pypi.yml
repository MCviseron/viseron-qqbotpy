name: Publish to PyPI

# 推送 v* tag 即发布正式版；也可以在 Actions 页面手动指定 tag 重跑。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "要发布的 tag（例如 v0.4.2）"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Run tests
        run: python -m pytest -q -rs

      - name: Check release consistency (tag must be v<version>)
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/check_release.py

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Show artifacts
        run: ls -l dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-pypi
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/viseron-qqbotpy
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-pypi
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # 默认会同时生成 PEP 740 数字证明（attestations），无需额外配置。
